<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>

    <header class="d-flex flex-row align-items-center justify-content-center w-100 mb-3 header">
        <img src="img/index(login)/logo.png" width="140" class="img-fluid">
        
        <h1 class="mb-0 ms-3 display-6">Control de stock y ventas</h1>
    </header>

    <div id="mensajeError" class="d-flex justify-content-center"></div>

    <main class="container d-flex justify-content-center align-items-center min-vh-100 py-3">

        <form id="loginForm" class="w-75 w-md-50 p-4 rounded-3 shadow d-flex flex-column">

            <div class="mb-3 mt-auto">
                <label for="nombreUsuario" class="form-label fs-5">Usuario (CI):</label>
                <input type="text" class="form-control" id="nombreUsuario" name="nombre" placeholder="12345678"  maxlength="8">
            </div>

            <div class="mb-3 mt-auto">
                <label for="contraseñaUsuario" class="form-label fs-5">Contraseña:</label>
                <input type="password" class="form-control" id="contraseñaUsuario" name="contraseña" placeholder="*******">
            </div>
            
            <div class="mb-3 mt-auto">
                <label for="rolUsuario" class="form-label fs-5">Rol:</label>
                <select id="rolUsuario" class="form-select fs-6" name="rol">
                    <option value="">Seleccione un rol</option>
                    <option value="admin">Administrador</option>
                    <option value="vendedor">Vendedor</option>
                    <option value="repositor">Repositor</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary text-black w-95 py-2 fw-bold m-3 align-self-center shadow">Iniciar sesion</button>
        </form>
    </main>

    <footer class="d-flex text-black p-3 justify-content-center">

        <h3 class="h4"> ©2026  Archivement Proyect.</h3>

    </footer">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/login.js"></script>
</body>
</html>
