<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="img/index(login)/logo.png" width="200">
        
        <h1>Control de stock y ventas</h1>
    </header>
    <main>
        <form action="dashboard.html">
            <label for="nombreUsuario">Usuario:</label>
            <input type="text" id="nombreUsuario" name="nombre" placeholder="12345678">
            
            <label for="contraseñaUsuario">Contraseña:</label>
            <input type="password" id="contraseñaUsuario" name="contraseña" placeholder="*******">
            
            <button type="submit">Iniciar sesion</button>
        </form>
    </main>
    <footer>
        <h2> ©2026  Archivement Proyect.</h2>
    </footer>
</body>
</html>
