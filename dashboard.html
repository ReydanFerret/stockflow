<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <img src="img/index(login)/logo.png" alt="Logo StockFlow" width="200">
        <h1>Control de Stock y Ventas</h1>
    </header>

    <h2>Lista de Productos</h2>

    <div class="agregar-producto">
        <input type="text" id="producto" placeholder="Producto">
        <input type="number" id="precio" placeholder="Precio">
        <input type="number" id="stock" placeholder="Stock">

        <button onclick="agregarProducto()">
            Agregar Producto
        </button>
    </div>

    <table id="tablaProductos">
        <tr>
            <th>Número de producto</th>
            <th>Producto</th>
            <th>Precio</th>
            <th>Stock</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Mouse Gamer</td>
            <td>$25</td>
            <td>15</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Teclado Mecánico</td>
            <td>$60</td>
            <td>8</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Auriculares</td>
            <td>$40</td>
            <td>12</td>
        </tr>
    </table>

    <footer>
        <h2>©2026 Archivement Project</h2>
    </footer>

    <script>
        let contador = 4;

        function agregarProducto() {

            let producto = document.getElementById("producto").value;
            let precio = document.getElementById("precio").value;
            let stock = document.getElementById("stock").value;

            if (producto === "" || precio === "" || stock === "") {
                alert("Completa todos los campos.");
                return;
            }

            let tabla = document.getElementById("tablaProductos");

            let fila = tabla.insertRow();

            fila.insertCell(0).innerHTML = contador++;
            fila.insertCell(1).innerHTML = producto;
            fila.insertCell(2).innerHTML = "$" + precio;
            fila.insertCell(3).innerHTML = stock;

            document.getElementById("producto").value = "";
            document.getElementById("precio").value = "";
            document.getElementById("stock").value = "";
        }
    </script>

</body>
</html>
