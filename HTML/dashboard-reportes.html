<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/Estilos/style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="d-flex flex-row align-items-center justify-content-center w-100 header">
        <img src="/img/index(login)/logo.png" alt="Logo StockFlow" width="200" class="img-fluid">
        <h1 class="mb-0 ms-3 display-6">Control de Stock y Ventas</h1>
    </header>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav w-100 justify-content-around">
                    <a class="nav-link fs-5" href="index.html">Cerrar Sesión</a>
                    <a class="nav-link fs-5" href="dashboard.html">Dashboard</a>
                    <a class="nav-link fs-5" href="dashboard-vendedor.html">Ventas</a>
                    <a class="nav-link fs-5" href="dashboard-repositor.html">Inventario</a>
                    <a class="nav-link fs-5" href="dashboard-gastos.html">Gastos</a>
                </div>
            </div>
        </div>
    </nav>

    <h2 class="fs-2 p-4 text-center mx-auto my-4 rounded-3">Generador de reportes</h2>

    <div class="container-fluid d-flex w-auto align-items-center mx-auto flex-wrap">
        <label for="fechaDesde" class="form-label fs-5 w-auto mx-3 mb-3">Fecha inicial</label>
        <input type="date" class="form-control w-auto mx-3 mb-3" id="fechaDesde" name="fechaInicio" min="2000-01-01" max="2026-12-31">
        
        <label for="fechaHasta" class="form-label fs-5 w-auto mx-3 mb-3">Fecha final</label>
        <input type="date" class="form-control mx-3 w-auto mb-3" id="fechaHasta" name="fechaInicio" min="2000-01-01" max="2026-12-31">
        
        <select id="tipoReporte" class="form-select fs-6 w-auto mx-3 mb-3" name="tipoReporte">
            <option value="">Seleccione un tipo</option>
            <option value="admin">Ventas</option>
            <option value="vendedor">Inventario</option>
            <option value="repositor">Gastos</option>
        </select>

        <button id="btnGenerarReportes" class="btn btn-primary mb-3 fs-6 mx-3 w-auto">
            Generar reporte
        </button>
    </div>

    <div class="container-fluid px-4 mb-4">
        <div class="overflow-auto rounded-4 shadow-sm">
            <table id="tablaReportes" class="table mb-0">
                <thead class="text-center text-white">
                    <tr class="fs-5">
                        <th class="p-3">Fecha inicio</th>
                        <th class="p-3">Fecha fin</th>
                        <th class="p-3">Tipo</th>
                        <th class="p-3">Archivo</th>

                        <tbody class="fs-5">
                            <tr>
                                <td>12/07/2026</td>
                                <td>15/07/2026</td>
                                <td>Gastos</td>
                                <td>Sin archivo</td>
                            </tr>
                        </tbody>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
    <footer class="d-flex text-black p-3 justify-content-center">
        <h3 class="h4">©2026 Archivement Project</h3>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
